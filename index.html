<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사진 편집">
<title>사진 편집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&family=Noto+Serif+KR&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu&family=East+Sea+Dokdo&family=Roboto&family=Playfair+Display&family=Oswald&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Dancing+Script&family=Permanent+Marker&family=Anton&family=Caveat&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 편집 화면 -->
  <div id="stage">
    <div id="empty">
      <p>사진을 불러와 편집을 시작하세요</p>
      <button id="emptyOpen" class="btn primary">사진 불러오기</button>
    </div>

    <div id="frame" hidden>
      <canvas id="work"></canvas>
      <canvas id="ov"></canvas>
      <div id="dimClip" hidden><div id="dim"></div></div>
      <div id="cropBox" hidden>
        <span class="h n" data-h="n"></span>
        <span class="h s" data-h="s"></span>
        <span class="h w" data-h="w"></span>
        <span class="h e" data-h="e"></span>
        <span class="h nw" data-h="nw"></span>
        <span class="h ne" data-h="ne"></span>
        <span class="h sw" data-h="sw"></span>
        <span class="h se" data-h="se"></span>
      </div>
    </div>
  </div>

  <!-- 모자이크·글자·화살표·도형 옵션 -->
  <div id="opts" hidden>
    <p id="tip"></p>
    <div class="orow" id="rowText">
      <input id="txt" type="text" value="텍스트" maxlength="60" aria-label="글자 내용">
      <select id="font" aria-label="글꼴">
        <optgroup label="한글">
          <option value="Noto Sans KR">노토 고딕</option>
          <option value="Noto Serif KR">노토 명조</option>
          <option value="Nanum Gothic">나눔고딕</option>
          <option value="Nanum Myeongjo">나눔명조</option>
          <option value="Nanum Pen Script">나눔 손글씨</option>
          <option value="Black Han Sans">블랙한산스</option>
          <option value="Do Hyeon">도현</option>
          <option value="Jua">주아</option>
          <option value="Gaegu">개구</option>
          <option value="East Sea Dokdo">동해 독도</option>
        </optgroup>
        <optgroup label="English">
          <option value="Roboto">Roboto</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Oswald">Oswald</option>
          <option value="Bebas Neue">Bebas Neue</option>
          <option value="Lobster">Lobster</option>
          <option value="Pacifico">Pacifico</option>
          <option value="Dancing Script">Dancing Script</option>
          <option value="Permanent Marker">Permanent Marker</option>
          <option value="Anton">Anton</option>
          <option value="Caveat">Caveat</option>
        </optgroup>
      </select>
    </div>
    <div class="orow" id="rowShape">
      <button class="chip on" data-shape="rect">사각형</button>
      <button class="chip" data-shape="ellipse">원</button>
      <label class="chk"><input type="checkbox" id="fill">채우기</label>
    </div>
    <div class="orow" id="rowColor">
      <div id="swatches"></div>
      <input type="color" id="col" value="#ff3b30" aria-label="색 직접 선택">
    </div>
    <div class="orow">
      <span id="szl">굵기</span>
      <input type="range" id="sz" min="1" max="40" value="5">
      <button class="btn small" id="optDone">확정</button>
      <button class="btn small" id="optDel">삭제</button>
    </div>
  </div>

  <!-- 기본 도구 모음 -->
  <nav id="tools">
    <button class="tool" id="btnOpen">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>불러오기
    </button>
    <button class="tool" id="btnRotL" disabled>
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>왼쪽
    </button>
    <button class="tool" id="btnRotR" disabled>
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>오른쪽
    </button>
    <button class="tool" id="btnCrop" disabled>
      <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>자르기
    </button>
    <button class="tool" id="btnMosaic" data-tool="mosaic" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>모자이크
    </button>
    <button class="tool" id="btnText" data-tool="text" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>글자
    </button>
    <button class="tool" id="btnArrow" data-tool="arrow" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5M9 5h10v10"/></svg>화살표
    </button>
    <button class="tool" id="btnShape" data-tool="shape" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="11" height="11" rx="1"/><circle cx="15" cy="15" r="6"/></svg>도형
    </button>
    <button class="tool" id="btnUndo" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>되돌리기
    </button>
    <button class="tool accent" id="btnSave" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>저장·공유
    </button>
  </nav>

  <!-- 자르기 도구 모음 -->
  <nav id="cropBar" hidden>
    <div class="chips">
      <button class="chip on" data-r="0">자유</button>
      <button class="chip" data-r="1">1:1</button>
      <button class="chip" data-r="1.3333333333">4:3</button>
      <button class="chip" data-r="0.75">3:4</button>
      <button class="chip" data-r="1.7777777778">16:9</button>
      <button class="chip" data-r="0.5625">9:16</button>
    </div>
    <div class="row">
      <button class="btn" id="cropCancel">취소</button>
      <button class="btn primary" id="cropApply">적용</button>
    </div>
  </nav>
</div>

<!-- 저장·공유 시트 -->
<div id="sheet" hidden>
  <div class="panel">
    <img id="preview" alt="완성된 사진 미리보기">
    <p id="info"></p>
    <p id="hint"></p>
    <button class="btn primary" id="shareBtn" disabled>공유 / 사진에 저장</button>
    <a class="btn" id="dlLink">파일로 저장</a>
    <button class="btn" id="closeBtn">닫기</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script src="app.js"></script>
<script src="tools.js"></script>
</body>
</html>
